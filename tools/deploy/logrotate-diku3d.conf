# The site's own access log, kept for good: one file a day, named for the day
# its lines are from, never removed (tools/deploy/stats.sh reads them all).
# It sits outside /var/log/nginx because nginx's own rotation there matches
# *.log and throws away anything older than 14 days. Installed by deploy.sh
# as /etc/logrotate.d/diku3d.
/var/log/diku3d/access.log {
	daily
	missingok
	rotate -1
	dateext
	dateyesterday
	compress
	delaycompress
	notifempty
	create 0640 www-data adm
	postrotate
		invoke-rc.d nginx rotate >/dev/null 2>&1
	endscript
}
