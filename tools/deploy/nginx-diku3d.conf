# diku3d.com — the single-player viewer as static files, behind Cloudflare.
# Installed by deploy.sh to /etc/nginx/sites-available/diku3d-com.
#
# TLS is a Cloudflare Origin CA certificate (valid to 2041, zone SSL mode
# "Full (strict)"): only Cloudflare trusts it, which is fine because the
# records are proxied and nobody else should be talking to this block. No
# certbot, so port 80 only redirects.
server {
    listen 80;
    listen [::]:80;
    server_name diku3d.com www.diku3d.com;
    return 301 https://diku3d.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.diku3d.com;

    ssl_certificate     /etc/ssl/certs/diku3d.com.origin.pem;
    ssl_certificate_key /etc/ssl/private/diku3d.com.key;

    return 301 https://diku3d.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name diku3d.com;

    ssl_certificate     /etc/ssl/certs/diku3d.com.origin.pem;
    ssl_certificate_key /etc/ssl/private/diku3d.com.key;

    # Every request comes through Cloudflare, so nginx sees Cloudflare's
    # address; take the visitor's from CF-Connecting-IP, but only when the
    # request really comes from Cloudflare (www.cloudflare.com/ips, 2026-10).
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;

    # Its own log, for GoAccess (tools/deploy/stats.sh); rotated with the rest.
    access_log /var/log/nginx/diku3d.access.log combined;

    root /srv/diku3d;
    index index.html;

    # The browser fetches merc21/area/*.are and assets/*.glb itself, and
    # nginx's mime.types knows neither. The area files are Latin-1, as the
    # mud wrote them.
    location ~ \.are$ {
        default_type "text/plain; charset=iso-8859-1";
    }
    location ~ \.glb$ {
        default_type model/gltf-binary;
        add_header Cache-Control "public, max-age=3600" always;
    }

    gzip on;
    gzip_types application/javascript text/plain model/gltf-binary;
    gzip_vary on;

    # Nothing has a hashed name, so a deploy must show up on the next load:
    # code and data revalidate every time (a 304 is cheap); the models are
    # big and change rarely, an hour is a safe margin.
    add_header Cache-Control "no-cache" always;

    location = /REVISION { return 404; }

    # The game server (systemd diku3d-server, loopback only). Cloudflare
    # passes WebSockets through; an idle socket is kept for an hour.
    location = /ws {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # The server's source is deployed beside the site but is not part of it.
    location ^~ /server/ { return 404; }

    location / {
        try_files $uri $uri/ =404;
    }
}
