# diku3d.com — the single-player viewer as static files, behind Cloudflare.
# Installed by deploy.sh to /etc/nginx/sites-available/diku3d-com.
#
# TLS is a Cloudflare Origin CA certificate (valid to 2041, zone SSL mode
# "Full (strict)"): only Cloudflare trusts it, which is fine because the
# records are proxied and nobody else should be talking to this block. No
# certbot, so port 80 only redirects.
server {
    listen 80;
    listen [::]:80;
    server_name diku3d.com www.diku3d.com;
    return 301 https://diku3d.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.diku3d.com;

    ssl_certificate     /etc/ssl/certs/diku3d.com.origin.pem;
    ssl_certificate_key /etc/ssl/private/diku3d.com.key;

    return 301 https://diku3d.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name diku3d.com;

    ssl_certificate     /etc/ssl/certs/diku3d.com.origin.pem;
    ssl_certificate_key /etc/ssl/private/diku3d.com.key;

    root /srv/diku3d;
    index index.html;

    # The browser fetches merc21/area/*.are and assets/*.glb itself, and
    # nginx's mime.types knows neither. The area files are Latin-1, as the
    # mud wrote them.
    location ~ \.are$ {
        default_type "text/plain; charset=iso-8859-1";
    }
    location ~ \.glb$ {
        default_type model/gltf-binary;
        add_header Cache-Control "public, max-age=3600" always;
    }

    gzip on;
    gzip_types application/javascript text/plain model/gltf-binary;
    gzip_vary on;

    # Nothing has a hashed name, so a deploy must show up on the next load:
    # code and data revalidate every time (a 304 is cheap); the models are
    # big and change rarely, an hour is a safe margin.
    add_header Cache-Control "no-cache" always;

    location = /REVISION { return 404; }

    location / {
        try_files $uri $uri/ =404;
    }
}
